<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paylum Signup</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      height: 100vh;
      background: url("Images/BackgroundImageIndex.jpg") no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }

    .main-part {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height:calc(100vh - 80px);
      text-align:center;
    }

    .signup-box {
      background-color: rgba(0,0,0,0.75);
      padding: 30px 20px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 30px deeppink, 0 0 30px cyan;
      overflow-y: auto;
      max-height: 75vh;
    }

    .error-msg { 
      color:#ff6b6b; 
      font-size:0.9rem; 
      text-align:left; 
      min-height:1.1rem; 
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #ccc;
      font-size: 1.2rem;
    }

    .reload-btn { 
      background:#ffc107; 
      color:black; 
      border:none; 
      padding:4px 10px; 
      border-radius:6px; 
      cursor:pointer; 
    }

    .btn-custom { 
      background:#00bfa5; 
      color:white; 
      border:none; 
      padding:10px; 
      border-radius:8px; 
      font-weight:700; 
      width:100%; 
      cursor:pointer; 
    }

    .logo-link { 
      position:absolute; 
      top:10px; 
      left:10px; 
      z-index:10; 
    }

    .logo-link img { 
      height:90px; 
      cursor:pointer; 
    }

    .back-btn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-weight: bold;
      border: 2px solid cyan;
      border-radius: 8px;
      background: transparent;
      color: white;
      transition: 0.3s ease-in-out;
      cursor: pointer;
    }

    .back-btn:hover {
      background: cyan;
      color: black;
    }
  </style>
</head>

<body>

<a href="index.html" class="logo-link">
  <img src="Images/Logo2-removebg-preview.png">
</a>

<div class="main-part">
  <div class="fs-4 fw-bold mb-4">Create Your Paylum Account</div>

  <form id="signupForm" class="signup-box" novalidate>

    <input id="name" class="form-control mb-2" placeholder="Full Name"/>
    <div id="err-name" class="error-msg"></div>

    <input id="email" class="form-control mb-2" placeholder="Email"/>
    <div id="err-email" class="error-msg"></div>

    <input id="phone" class="form-control mb-2" placeholder="Phone (10 digits)"/>
    <div id="err-phone" class="error-msg"></div>

    <input id="dob" type="date" class="form-control mb-2"/>
    <div id="err-dob" class="error-msg"></div>

    <select id="gender" class="form-select mb-2">
      <option value="">Select Gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
    <div id="err-gender" class="error-msg"></div>

    <input id="aadhaar" class="form-control mb-2" placeholder="Aadhaar (12 digits)"/>
    <div id="err-aadhaar" class="error-msg"></div>

    <!-- 🔥 NEW — Account Type -->
    <select id="account_type" class="form-select mb-2">
      <option value="">Select Account Type</option>
      <option>Savings</option>
      <option>Current</option>
      <option>Salary</option>
      <option>Joint</option>
      <option>Student</option>
    </select>
    <div id="err-type" class="error-msg"></div>
    <!-- END NEW FIELD -->

    <div class="password-wrapper mb-2">
      <input id="password" type="password" class="form-control" placeholder="Password"/>
      <span class="toggle-password" onclick="togglePassword('password')">👁️</span>
    </div>
    <div id="err-password" class="error-msg"></div>

    <div class="password-wrapper mb-2">
      <input id="confirm_password" type="password" class="form-control" placeholder="Confirm Password"/>
      <span class="toggle-password" onclick="togglePassword('confirm_password')">👁️</span>
    </div>
    <div id="err-confirm" class="error-msg"></div>

    <!-- CAPTCHA -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span id="signupCaptcha" class="fw-bold text-info">Loading…</span>
      <button type="button" class="reload-btn" onclick="generateSignupCaptcha()">⟳ Reload</button>
    </div>

    <input id="signupCaptchaInput" class="form-control mb-2" placeholder="Enter CAPTCHA"/>
    <div id="err-captcha" class="error-msg"></div>

    <div id="err-general" class="error-msg"></div>

    <button class="btn-custom mt-2" type="submit">Sign Up</button>
    <button type="button" onclick="window.location.href='index.html'" class="back-btn">⬅ Back</button>

  </form>
</div>

<script>
let signupCaptchaValue = "";
function generateSignupCaptcha() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  signupCaptchaValue = Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join("");
  document.getElementById("signupCaptcha").textContent = signupCaptchaValue;
}
window.addEventListener("DOMContentLoaded", generateSignupCaptcha);

function togglePassword(id) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
}

function sanitize(input) {
  return input.replace(/<.*?>|SELECT|INSERT|DELETE|UPDATE|DROP|--|;/gi,"").trim();
}

function calculateAge(dateString){
  const today = new Date();
  const dob = new Date(dateString);
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if(m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
  return age;
}

document.getElementById("signupForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  ["err-name","err-email","err-phone","err-dob","err-gender","err-aadhaar","err-password","err-confirm","err-captcha","err-type"]
    .forEach(id => document.getElementById(id).textContent="");

  const full_name = sanitize(document.getElementById("name").value);
  const email = sanitize(document.getElementById("email").value);
  const phone = document.getElementById("phone").value.trim();
  const dob = document.getElementById("dob").value;
  const gender = document.getElementById("gender").value;
  const aadhar = document.getElementById("aadhaar").value.trim();
  const account_type = document.getElementById("account_type").value; // NEW
  const password = sanitize(document.getElementById("password").value);
  const confirm = sanitize(document.getElementById("confirm_password").value);
  const captchaVal = sanitize(document.getElementById("signupCaptchaInput").value);

  let ok = true;

  if(!full_name.match(/^[A-Za-z\s]{3,50}$/)) { document.getElementById("err-name").textContent="Invalid name"; ok=false; }
  if(!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) { document.getElementById("err-email").textContent="Invalid email"; ok=false; }
  if(!phone.match(/^[6-9]\d{9}$/)) { document.getElementById("err-phone").textContent="Phone must be 10 digits"; ok=false; }

  if(!dob) { document.getElementById("err-dob").textContent="DOB required"; ok=false; }
  else if(calculateAge(dob) < 18) { document.getElementById("err-dob").textContent="You must be 18+"; ok=false; }

  if(!gender) { document.getElementById("err-gender").textContent="Gender required"; ok=false; }
  if(!aadhar.match(/^\d{12}$/)) { document.getElementById("err-aadhaar").textContent="Aadhaar must be 12 digits"; ok=false; }

  if(!account_type){ document.getElementById("err-type").textContent="Please select account type"; ok=false; }

  if(password.length < 6){ document.getElementById("err-password").textContent="Password too weak"; ok=false; }
  if(password !== confirm){
    document.getElementById("err-confirm").textContent="Passwords do not match";
    ok = false;
  }

  if(captchaVal !== signupCaptchaValue){
    document.getElementById("err-captcha").textContent="Incorrect CAPTCHA";
    ok=false;
  }

  if(!ok) return;

  // Save for OTP page
  localStorage.setItem("signup_data", JSON.stringify({
    full_name, email, phone, dob, gender, aadhar, password, account_type   // NEW
  }));

  window.location.href = "otp.html";
});
</script>

</body>
</html>
