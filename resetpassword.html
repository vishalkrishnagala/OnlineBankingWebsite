    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>Reset Password - Paylum Bank</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
        background-color: black;
        background-image: url("Images/BackgroundImageIndex.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;
        font-family: Arial, Helvetica, sans-serif;
        height: 100vh;
        margin: 0;
        padding: 40px;
        color: white;
        }

        .main-part {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: calc(100vh - 80px);
        text-align: center;
        }

        .reset-box {
        background-color: rgba(0, 0, 0, 0.7);
        padding: 30px 20px;
        border-radius: 15px;
        width: 330px;
        box-shadow: 0 0 30px limegreen, 0 0 30px deepskyblue;
        }

        .btn-custom {
        background-color: #00bfa5;
        color: white;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        }

        .btn-custom:hover {
        background-color: #008e76;
        }

        .captcha-btn {
        background-color: #ffc107;
        border: none;
        font-weight: bold;
        padding: 3px 10px;
        border-radius: 6px;
        }

        .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        }

        .password-wrapper {
        position: relative;
        }

        .hidden {
        display: none;
        }
    </style>
    </head>

    <body>

    <div class="main-part">
    <div class="fs-4 fw-bold mb-4">Reset Password</div>

    <form id="resetForm" class="reset-box">

        <!-- STEP 1 -->
        <input type="email" id="resetEmail" class="form-control mb-2" placeholder="Enter your email" required>

        <input type="text" id="resetAccount" class="form-control mb-2" placeholder="Enter Account Number" required>

        <div class="d-flex justify-content-between align-items-center mb-2">
        <span id="captchaCode" class="fw-bold fs-5 text-info">----</span>
        <button type="button" class="captcha-btn" onclick="generateCaptcha()">⟳</button>
        </div>

        <input type="text" id="captchaInput" class="form-control mb-3" placeholder="Enter CAPTCHA" required>

        <button type="button" id="getOtpBtn" class="btn btn-warning w-100 mb-3">
        Get OTP
        </button>

        <!-- STEP 2 -->
        <div id="otpSection" class="hidden">
        <input type="text" id="otpInput" class="form-control mb-3" placeholder="Enter OTP">

        <div class="password-wrapper mb-2">
            <input type="password" id="newPassword" class="form-control" placeholder="New Password">
            <span class="toggle-password" onclick="togglePassword('newPassword')">👁️</span>
        </div>

        <div class="password-wrapper mb-2">
            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password">
            <span class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</span>
        </div>

        <button class="btn btn-custom w-100 mt-2" type="submit">
            Reset Password
        </button>
        </div>

        <button type="button" onclick="window.location.href='login.html'" class="btn btn-secondary w-100 mt-3">
        ⬅ Back to Login
        </button>

    </form>
    </div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script type="module">
import { supabase } from "./config/supabaseClient.js";

/* ================= EMAILJS INIT ================= */
import {
  EMAILJS_PUBLIC_KEY,
  EMAILJS_SERVICE_ID,
  EMAILJS_TEMPLATE_ID
} from "./config/emailjs.js";

emailjs.init(EMAILJS_PUBLIC_KEY);

/* ================= CAPTCHA ================= */
let captcha = "";
function generateCaptcha() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  captcha = Array.from({ length: 6 }, () =>
    chars[Math.floor(Math.random() * chars.length)]
  ).join("");
  document.getElementById("captchaCode").textContent = captcha;
}
window.generateCaptcha = generateCaptcha;
window.onload = generateCaptcha;

/* ================= TOGGLE PASSWORD ================= */
window.togglePassword = function(id) {
  const el = document.getElementById(id);
  el.type = el.type === "password" ? "text" : "password";
};

/* ================= SHA256 ================= */
async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return [...new Uint8Array(buf)]
    .map(x => x.toString(16).padStart(2, "0"))
    .join("");
}

/* ================= OTP SYSTEM ================= */
let generatedOTP = "";
let otpTimer;
let timeLeft = 30;

const getOtpBtn = document.getElementById("getOtpBtn");
const otpSection = document.getElementById("otpSection");

/* ================= SEND REAL OTP ================= */

  )
  .then(() => {
    alert("OTP sent to your email!");
  })
  .catch(err => {
    console.error("EmailJS Error:", err);
    alert("Failed to send OTP email.");
  });
}

function startOtpTimer() {
  clearInterval(otpTimer);
  timeLeft = 30;

  otpTimer = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      clearInterval(otpTimer);
      generatedOTP = "";
      alert("OTP expired. Please request a new one.");
    }
  }, 1000);
}

/* ================= GET OTP ================= */
getOtpBtn.addEventListener("click", async () => {
  const email = resetEmail.value.trim();
  const accNo = resetAccount.value.trim();
  const cap = captchaInput.value.trim();

  if (!email || !accNo) return alert("Fill all fields.");
  if (cap !== captcha) {
    alert("Incorrect CAPTCHA");
    generateCaptcha();
    return;
  }

  /* 1️⃣ VERIFY USER */
  const { data: user, error: userErr } = await supabase
    .from("users")
    .select("id")
    .eq("email", email)
    .single();

  if (!user || userErr) return alert("Email not found.");

  /* 2️⃣ VERIFY ACCOUNT */
  const { data: acc, error: accErr } = await supabase
    .from("accounts")
    .select("account_number")
    .eq("id", user.id)
    .eq("account_number", accNo)
    .single();

  if (!acc || accErr) return alert("Account does not belong to this user.");

  /* 3️⃣ GENERATE OTP */
  generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

  /* 4️⃣ SEND REAL EMAIL OTP */
  sendOtpEmail(email, generatedOTP);
  startOtpTimer();

  otpSection.classList.remove("hidden");
});

/* ================= RESET PASSWORD ================= */
document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const enteredOtp = otpInput.value.trim();
  const pass1 = newPassword.value.trim();
  const pass2 = confirmPassword.value.trim();
  const email = resetEmail.value.trim();

  if (!generatedOTP) return alert("OTP expired. Request a new one.");
  if (enteredOtp !== generatedOTP) return alert("Invalid OTP");
  if (pass1.length < 6) return alert("Password must be at least 6 characters.");
  if (pass1 !== pass2) return alert("Passwords do not match.");

  const hashed = await sha256(pass1);

  const { error } = await supabase
    .from("users")
    .update({ password_hash: hashed })
    .eq("email", email);

  if (error) return alert("Password reset failed.");

  alert("Password reset successful!");
  window.location.href = "login.html";
});
</script>


    </body>
    </html>
