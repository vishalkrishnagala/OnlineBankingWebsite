<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transactions - Paylum Bank</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: white;
      min-height: 100vh;
    }

    .container-custom {
      max-width: 1000px;
      margin-top: 50px;
      padding: 20px;
      background-color: rgba(20, 20, 20, 0.9);
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 230, 230, 0.3);
    }

    .section-title {
      color: #00e6e6;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .table-dark th {
      color: #00e6e6;
      border-color: #333;
    }
    .table-dark td {
      border-color: #333;
    }

    .positive { 
      color: #28a745; 
      font-weight: bold; 
    }

    .negative { 
      color: #dc3545; 
      font-weight: bold; 
    }

    .loader {
      text-align: center;
      padding: 50px;
    }
  </style>
</head>
<body>

  <div class="container container-custom">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="section-title">Transaction History <i class="bi bi-cash-stack"></i></h2>
      <a href="main.html" class="btn btn-outline-info">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
      </a>
    </div>

    <p class="text-info mb-4">
      Viewing transactions for Account ID: 
      <strong id="accountIdDisplay">Loading...</strong>
    </p>

    <div class="table-responsive">
      <table class="table table-dark table-striped table-hover">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Description</th>
            <th>Amount (₹)</th>
          </tr>
        </thead>
        <tbody id="transactionsTableBody"></tbody>
      </table>
    </div>

    <div id="noTransactions" class="loader" style="display: none;">
      <p class="text-warning">
        <i class="bi bi-exclamation-triangle-fill"></i> 
        No transactions found for this account.
      </p>
    </div>

  </div>

  <div style="height: 50px;"></div>

  <script type="module">
  import { supabase } from "./config/supabaseClient.js";

const urlParams = new URLSearchParams(window.location.search);
const urlAccount = urlParams.get("acc");
const urlEmail = urlParams.get("email");

const activeAccountId =
  localStorage.getItem("active_account_identifier") || urlAccount;

const loggedEmail =
  localStorage.getItem("logged_in_email") || urlEmail;

const transactionsTableBody = document.getElementById("transactionsTableBody");
const accountIdDisplay = document.getElementById("accountIdDisplay");
const noTransactionsDiv = document.getElementById("noTransactions");

// --------------------
// AUTH GUARD ✅
// --------------------
if (!loggedEmail || !activeAccountId) {
  alert("Session expired. Login again.");
  window.location.href = "login.html";
  throw new Error("Unauthorized");
}

// Sync
localStorage.setItem("logged_in_email", loggedEmail);
localStorage.setItem("active_account_identifier", activeAccountId);

accountIdDisplay.textContent = activeAccountId.substring(0, 8) + "...";

// --------------------
function fmtMoney(n) {
  return new Intl.NumberFormat("en-IN", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(Number(n || 0));
}

// --------------------
async function loadTransactions(accountUUID) {
  transactionsTableBody.innerHTML = `
    <tr>
      <td colspan="4" class="text-center">
        <div class="spinner-border text-info"></div>
        <div>Loading...</div>
      </td>
    </tr>
  `;

  const { data: trans, error } = await supabase
    .from("transactions")
    .select("*")
    .eq("account_id", accountUUID)
    .order("transaction_date", { ascending: false });

  transactionsTableBody.innerHTML = "";

  if (error) {
    transactionsTableBody.innerHTML = `
      <tr>
        <td colspan="4" class="text-danger text-center">${error.message}</td>
      </tr>
    `;
    return;
  }

  if (!trans || trans.length === 0) {
    noTransactionsDiv.style.display = "block";
    return;
  }

  trans.forEach(t => {
    const date = new Date(t.transaction_date).toLocaleString();
    const type = t.type || "General";
    const amount = Number(t.amount || 0);

    const isCredit = type === "Deposit";
    const cls = isCredit ? "positive" : "negative";
    const sign = isCredit ? "+" : "-";

    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${date}</td>
      <td>${type}</td>
      <td>${t.description || "N/A"}</td>
      <td class="${cls}">${sign}${fmtMoney(Math.abs(amount))}</td>
    `;
    transactionsTableBody.appendChild(row);
  });
}

// --------------------
loadTransactions(activeAccountId);


  </script>

</body>
</html>
