<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paylum - Login OTP Verification</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: url("Images/BackgroundImageIndex.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      height: 100vh;
      margin: 0;
      padding: 40px;
    }

    .logo {
      position: absolute;
      top: 10px;
      left: 10px;
    }

    .logo img {
      height: 90px;
      cursor: pointer;
    }

    .main {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 80px);
      flex-direction: column;
      text-align: center;
    }

    .otp-box {
      background: rgba(0, 0, 0, 0.75);
      width: 380px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 30px deeppink, 0 0 30px cyan;
    }

    .otp-inputs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 15px;
    }

    .otp-inputs input {
      width: 50px;
      height: 55px;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      background: rgba(255,255,255,0.1);
      border: 2px solid cyan;
      color: white;
      border-radius: 8px;
    }

    .timer {
      margin-top: 15px;
      font-weight: bold;
      color: #ffdf70;
    }

    #resendBtn {
      cursor: pointer;
      color: #00e6e6;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<a class="logo" href="index.html">
  <img src="Images/Logo2-removebg-preview.png">
</a>

<div class="main">

  <div class="otp-box">
    <h2 class="fw-bold">Login OTP Verification</h2>
    <p>Enter the 6-digit OTP sent to your email</p>

    <div class="otp-inputs">
      <input maxlength="1" class="otp" inputmode="numeric">
      <input maxlength="1" class="otp" inputmode="numeric">
      <input maxlength="1" class="otp" inputmode="numeric">
      <input maxlength="1" class="otp" inputmode="numeric">
      <input maxlength="1" class="otp" inputmode="numeric">
      <input maxlength="1" class="otp" inputmode="numeric">
    </div>

    <button id="verifyBtn" class="btn btn-success w-100 mt-3">Verify OTP</button>

    <span id="resendBtn" class="text-info mt-2">Resend OTP</span>

    <button onclick="window.location.href='login.html'" class="btn btn-secondary w-100 mt-3">
      ⬅ Back
    </button>

    <div id="timerDisplay" class="timer">⏳ Time Left: 30s</div>
    <div style="margin-top:10px; font-size:13px; color:#ffdf70;">
      ⚠ If you did not receive the OTP, please check your <b>Spam / Junk</b> folder.
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script type="module">

  /* -------------------------------------------------------
      🔒 SECURITY CHECK — BLOCK DIRECT ACCESS
  ---------------------------------------------------------*/
  if (!localStorage.getItem("email_for_otp_login")) {
    alert("Unauthorized access! Please login first.");
    window.location.href = "login.html";
  }

  // Init EmailJS
  import {
  EMAILJS_PUBLIC_KEY,
  EMAILJS_SERVICE_ID,
  EMAILJS_TEMPLATE_ID
} from "./config/emailjs.js";

emailjs.init(EMAILJS_PUBLIC_KEY);

  const otpInputs = document.querySelectorAll(".otp");
  const verifyBtn = document.getElementById("verifyBtn");
  const resendBtn = document.getElementById("resendBtn");
  const timerDisplay = document.getElementById("timerDisplay");

  const loginEmail = localStorage.getItem("email_for_otp_login");

  let otp = Math.floor(100000 + Math.random() * 900000).toString();
  let timeLeft = 30;
  let timer;

  // Send initial OTP
  sendEmailOtp(loginEmail, otp);

  startTimer();

  function startTimer() {
    clearInterval(timer);
    timeLeft = 30;
    verifyBtn.disabled = false;

    timer = setInterval(() => {
      timeLeft--;
      timerDisplay.textContent = `⏳ Time Left: ${timeLeft}s`;

      if (timeLeft <= 0) {
        clearInterval(timer);
        timerDisplay.textContent = "❌ OTP Expired";
        verifyBtn.disabled = true;
      }
    }, 1000);
  }

  function sendEmailOtp(email, code) {
    emailjs.send(
    EMAILJS_SERVICE_ID,
    EMAILJS_TEMPLATE_ID,
    {
      passcode: code,
      time: "30 seconds",
      email: email
    }
  )
    .then(() => console.log("Login OTP sent:", code))
    .catch(err => {
      console.error("EmailJS error:", err);
      alert("Could not send OTP email.");
    });
  }

  // Input behavior
 // ✅ Perfect OTP Input + Backspace Navigation
otpInputs.forEach((input, index) => {

  // Only allow numbers + auto move forward
  input.addEventListener("input", () => {
    input.value = input.value.replace(/[^0-9]/g, "");
    if (input.value && index < otpInputs.length - 1) {
      otpInputs[index + 1].focus();
    }
  });

  // ✅ Proper Backspace Handling
  input.addEventListener("keydown", (e) => {
    if (e.key === "Backspace") {

      // If current box has value → clear it only
      if (input.value !== "") {
        input.value = "";
        return;
      }

      // If already empty → move to previous box
      if (index > 0) {
        otpInputs[index - 1].focus();
        otpInputs[index - 1].value = "";
      }
    }
  });

});


  // Verify OTP
  verifyBtn.addEventListener("click", async () => {
    let entered = "";
    otpInputs.forEach(i => entered += i.value);

    if (entered.length !== 6) return alert("Enter all 6 digits");
    if (entered !== otp) return alert("Incorrect OTP!");

    // Create login session
    localStorage.setItem("logged_in_email", loginEmail);
    localStorage.removeItem("email_for_otp_login");

    alert("Login successful!");

    window.location.href = "main.html";
  });

  // Resend OTP
  resendBtn.addEventListener("click", () => {
    otp = Math.floor(100000 + Math.random() * 900000).toString();
    sendEmailOtp(loginEmail, otp);
    otpInputs.forEach(i => i.value = "");
    otpInputs[0].focus();
    startTimer();
  });
</script>

</body>
</html>
