<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kiddy Login – Paylum Bank</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background:url("Images/BackgroundImageIndex.jpg") center/cover fixed;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
  height:100vh;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box{
  background:rgba(0,0,0,0.8);
  padding:30px;
  border-radius:15px;
  width:330px;
  box-shadow:0 0 30px limegreen,0 0 30px deepskyblue;
  text-align:center;
}

.btn-custom{
  background:#00bfa5;
  color:white;
  font-weight:bold;
}

.btn-custom:hover{
  background:#008e76;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="login-box">
  <h4 class="mb-3">👶 Kiddy Login</h4>

  <!-- STEP 1 -->
  <input id="childEmail" class="form-control mb-2" placeholder="Child Email" type="email" required>

  <button id="getOtpBtn" class="btn btn-warning w-100 mb-3">Get OTP</button>

  <!-- STEP 2 -->
  <div id="otpBox" class="hidden">
    <input id="otpInput" class="form-control mb-2" placeholder="Enter OTP">
    <button id="loginBtn" class="btn btn-custom w-100">Login</button>
  </div>

  <button onclick="location.href='index.html'" class="btn btn-outline-light w-100 mt-3">⬅ Back</button>

  <div id="msg" class="mt-3 fw-bold"></div>
</div>

<!-- ================= SUPABASE ================= -->
<script type="module">
import { supabase } from "./config/supabaseClient.js";

const emailBox = document.getElementById("childEmail");
const getOtpBtn = document.getElementById("getOtpBtn");
const loginBtn  = document.getElementById("loginBtn");
const otpBox    = document.getElementById("otpBox");
const otpInput  = document.getElementById("otpInput");
const msg       = document.getElementById("msg");

let GENERATED_OTP = "";
let WALLET_ID = null;

/* ================= GET OTP ================= */
getOtpBtn.addEventListener("click", async () => {
  msg.textContent="";
  const email = emailBox.value.trim();

  if(!email){
    alert("Enter child email");
    return;
  }

  // ✅ Verify child in DB
  const { data, error } = await supabase
    .from("kiddy_wallets")
    .select("wallet_id")
    .eq("child_email", email)
    .single();

  if(error || !data){
    msg.style.color="red";
    msg.textContent="Child account not found.";
    return;
  }

  WALLET_ID = data.wallet_id;

  // ✅ Generate OTP
  GENERATED_OTP = Math.floor(100000 + Math.random() * 900000).toString();
  alert("OTP For Demo: " + GENERATED_OTP); // 🔐 You can replace with EmailJS later

  otpBox.classList.remove("hidden");
  msg.style.color="#00e6e6";
  msg.textContent="OTP Sent Successfully!";
});

/* ================= LOGIN ================= */
loginBtn.addEventListener("click", () => {
  const enteredOtp = otpInput.value.trim();

  if(enteredOtp !== GENERATED_OTP){
    msg.style.color="red";
    msg.textContent="Invalid OTP.";
    return;
  }

  // ✅ Store child session
  localStorage.setItem("kiddy_wallet_id", WALLET_ID);

  // ✅ Redirect to spending dashboard
  location.href = "Features/kiddy-spend.html";
});
</script>

</body>
</html>
