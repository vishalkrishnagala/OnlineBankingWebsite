<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paylum Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: black;
      background-image: url("Images/BackgroundImageIndex.jpg");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      font-family: Arial, Helvetica, sans-serif;
      height: 100vh;
      margin: 0;
      padding: 40px;
      color: white;
    }

    .main-part {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 80px);
      text-align: center;
    }

    .login-box {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 30px 20px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 0 30px limegreen, 0 0 30px deepskyblue;
      animation: animate 2s linear infinite;
    }

    @keyframes animate {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .btn-custom {
      background-color: #00bfa5;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
    }

    .btn-custom:hover {
      background-color: #008e76;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #ccc;
    }

    .logo-link img {
      height: 90px;
    }

    .logo-link {
      position: absolute;
      top: 10px;
      left: 10px;
      cursor: pointer;
    }

    .error-msg {
      font-size: 0.85rem;
      color: #ff4d4d;
      margin-bottom: 8px;
    }

    .reload-btn {
      background-color: #ffc107;
      color: black;
      font-weight: bold;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .new-user {
      margin-top: 15px;
      color: #00e6e6;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- Logo -->
  <a href="index.html" class="logo-link">
    <img src="Images/Logo2-removebg-preview.png">
  </a>

  <div class="main-part">
    <div class="fs-4 fw-bold mb-4">Login to Paylum</div>

    <form id="loginForm" class="login-box">

      <input type="text" id="loginIdentifier" class="form-control mb-1" placeholder="Email" required />
      <div id="loginIdError" class="error-msg"></div>

      <div class="password-wrapper mb-1">
        <input type="password" id="loginPassword" class="form-control" placeholder="Password" required />
        <span class="toggle-password" onclick="togglePassword('loginPassword')">👁️</span>
      </div>
      <div id="loginPassError" class="error-msg"></div>

      <div class="d-flex justify-content-between align-items-center mb-1">
        <span id="loginCaptchaCode" class="fw-bold fs-5 text-info">Loading...</span>
        <button type="button" class="reload-btn" onclick="generateCaptcha()">⟳ Reload</button>
      </div>

      <input type="text" id="loginCaptchaInput" class="form-control mb-1" placeholder="Enter CAPTCHA" required />
      <div id="loginCaptchaError" class="error-msg"></div>

      <!-- Login -->
      <button type="submit" class="btn btn-custom w-100 mt-2">Login</button>

      <button type="button" onclick="window.location.href='index.html'" class="btn btn-secondary w-100 mt-2">
        ⬅ Back
      </button>
      <!-- Forgot Password -->
      <div class="mt-2">
        <a href="resetpassword.html" style="color:#ffc107; text-decoration:none; font-weight:bold;">
          Forgot Password?
        </a>
      </div>


      <!-- New User -->
      <div class="new-user" onclick="window.location.href='signup.html'">
        New user? Click here to create an account
      </div>

    </form>
  </div>

 <script type="module">
  import { supabase } from "./config/supabaseClient.js";

  let loginCaptcha = "";

  /* ---------------- CAPTCHA ---------------- */
  function generateCaptcha() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    loginCaptcha = Array.from({ length: 6 }, () =>
      chars[Math.floor(Math.random() * chars.length)]
    ).join("");
    document.getElementById("loginCaptchaCode").textContent = loginCaptcha;
  }
  window.generateCaptcha = generateCaptcha;
  window.onload = generateCaptcha;

  /* ---------------- TOGGLE PASSWORD ---------------- */
  window.togglePassword = function(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
  };

  /* ---------------- SHA256 ---------------- */
  async function sha256(text) {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return [...new Uint8Array(buf)]
      .map(x => x.toString(16).padStart(2, "0"))
      .join("");
  }

  /* ---------------- LOGIN FLOW ---------------- */
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    // Clear old errors
    loginIdError.textContent = "";
    loginPassError.textContent = "";
    loginCaptchaError.textContent = "";

    const email = loginIdentifier.value.trim();
    const password = loginPassword.value.trim();
    const captcha = loginCaptchaInput.value.trim();

    if (!email) {
      loginIdError.textContent = "Email is required.";
      return;
    }

    if (!password) {
      loginPassError.textContent = "Password is required.";
      return;
    }

    if (captcha !== loginCaptcha) {
      loginCaptchaError.textContent = "Incorrect CAPTCHA.";
      generateCaptcha();
      return;
    }

    const hashedPassword = await sha256(password);

    // ✅ Fetch user
    const { data: user, error } = await supabase
      .from("users")
      .select("*")
      .eq("email", email)
      .single();

    // ❌ Email not found
    if (!user || error) {
      loginIdError.textContent = "Email not registered.";
      return;
    }

    // ❌ Password mismatch
    if (user.password_hash !== hashedPassword) {
      loginPassError.textContent = "Incorrect password.";
      return;
    }

    // ✅ SUCCESS → OTP LOGIN
    localStorage.setItem("email_for_otp_login", email);
    window.location.href = "loginotp.html";
  });
</script>


</body>
</html>
