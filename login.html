<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paylum Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background-color: black;
      background-image: url("Images/BackgroundImageIndex.jpg");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      font-family: Arial, Helvetica, sans-serif;
      height: 100vh;
      margin: 0;
      padding: 40px;
      color: white;
    }

    .main-part {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 80px);
      text-align: center;
    }

    .login-box {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 30px 20px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 0 30px limegreen, 0 0 30px deepskyblue;
      animation: animate 2s linear infinite;
    }

    @keyframes animate {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .form-control::placeholder {
      color: #444;
      font-weight: 500;
    }

    .btn-custom {
      background-color: #00bfa5;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #008e76;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #ccc;
    }

    .logo-link img {
      height: 100px;
    }

    .logo-link {
      position: absolute;
      top: 10px;
      left: 10px;
    }

    .error-msg {
      font-size: 0.85rem;
      color: #ff4d4d;
      margin-bottom: 8px;
    }

    .reload-btn {
      background-color: #ffc107;
      color: black;
      font-weight: bold;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .reload-btn:hover {
      background-color: #e0a800;
    }
  </style>
</head>
<body>

  <!-- Logo in top-left corner -->
  <a href="index.html" class="logo-link">
    <img src="Images/Logo2-removebg-preview.png" alt="Paylum Logo">
  </a>

  <div class="main-part">
    <div class="text-entry fs-4 fw-bold text-shadow mb-4">Login to Paylum</div>

    <form id="loginForm" class="login-box" novalidate>
      <input type="text" id="usernameInput" class="form-control mb-1" placeholder="Username" required />
      <div id="usernameError" class="error-msg"></div>

      <div class="password-wrapper mb-1">
        <input type="password" id="passwordInput" class="form-control" placeholder="Password" required />
        <span class="toggle-password" onclick="togglePassword()">👁️</span>
      </div>
      <div id="passwordError" class="error-msg"></div>

      <div class="mb-1 d-flex justify-content-between align-items-center">
        <span id="captchaCode" class="fw-bold fs-5 text-info">Loading...</span>
        <button type="button" class="reload-btn" onclick="generateCaptcha()">⟳ Reload</button>
      </div>
      <input type="text" id="captchaInput" class="form-control mb-1" placeholder="Enter the code above" required />
      <div id="captchaError" class="error-msg"></div>

      <input type="submit" class="btn btn-custom w-100" value="Submit" />
    </form>
  </div>

  <script>
    let currentCaptcha = "";

    function generateCaptcha() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      currentCaptcha = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
      document.getElementById("captchaCode").textContent = currentCaptcha;
    }

    function togglePassword() {
      const input = document.getElementById("passwordInput");
      input.type = input.type === "password" ? "text" : "password";
    }

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      document.getElementById("usernameError").textContent = "";
      document.getElementById("passwordError").textContent = "";
      document.getElementById("captchaError").textContent = "";

      const username = document.getElementById("usernameInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();
      const captcha = document.getElementById("captchaInput").value.trim();
      let valid = true;

      if (!/^[a-zA-Z0-9]{3,20}$/.test(username)) {
        document.getElementById("usernameError").textContent = "Username must be 3–20 alphanumeric characters.";
        valid = false;
      }

      if (/[<>"'`]/.test(password)) {
        document.getElementById("passwordError").textContent = "Password contains invalid characters.";
        valid = false;
      }

      if (captcha !== currentCaptcha) {
        document.getElementById("captchaError").textContent = "Incorrect CAPTCHA code.";
        valid = false;
      }

      if (valid) {
        alert("Validation passed. Proceeding with login...");
        // Add backend integration here
      }
    });

    window.onload = generateCaptcha;
  </script>
</body>
</html>
