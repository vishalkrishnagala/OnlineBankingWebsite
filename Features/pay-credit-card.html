<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pay Credit Card Bill – Paylum Bank</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{background:url("../Images/BackgroundImageIndex.jpg") center/cover fixed;color:#fff;font-family:'Segoe UI',sans-serif;margin:0;}
.sidebar{position:fixed;top:0;left:-250px;width:250px;height:100%;background:rgba(0,0,0,.9);padding-top:60px;transition:left .25s;z-index:999}
.sidebar.show{left:0}.sidebar a{display:block;padding:15px 25px;color:#ccc;text-decoration:none;font-weight:500}
.sidebar a:hover{background:#00e6e6;color:#000}
.menu-toggle{position:fixed;top:15px;left:15px;z-index:1000}.menu-toggle img{width:40px}
.box{background:rgba(0,0,0,.85);padding:40px;border-radius:15px;box-shadow:0 0 15px #00e6e6;margin-top:120px}
footer{background:#000;text-align:center;padding:20px;color:#aaa;margin-top:100px}
</style>
</head>

<body>

<div class="menu-toggle">
  <button id="menuBtn" class="btn btn-link p-0">
    <img src="../Images/transparent-hd-white-menu-burger-icon-701751695037039ulxnzxwywi.png">
  </button>
</div>

<div id="sidebar" class="sidebar">
  <a href="../main.html"><i class="bi bi-house-door"></i> Home</a>
  <a href="../main.html"><i class="bi bi-person-circle"></i> Account</a>
  <a href="../main.html"><i class="bi bi-gear"></i> Features</a>
  <a id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="container">
  <div class="box">
    <h2 class="text-info mb-3"><i class="bi bi-credit-card-2-front-fill"></i> Pay Credit Card Bill</h2>

    <form id="ccPayForm">
      <div class="mb-3">
        <label class="form-label">Card Number</label>
        <input type="text" class="form-control" id="ccNumber" maxlength="16" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Bill Amount (₹)</label>
        <input type="number" class="form-control" id="ccAmount" required>
      </div>

      <button class="btn btn-success w-100">
        <i class="bi bi-check-circle"></i> Pay Now
      </button>
    </form>

    <div id="ccMsg" class="text-center fw-bold mt-3"></div>
  </div>
</div>

<footer>&copy; 2025 Paylum Bank</footer>

<script>
document.addEventListener("DOMContentLoaded",()=>{

  const s=document.getElementById("sidebar");
  const m=document.getElementById("menuBtn");

  m.onclick = () => s.classList.toggle("show");
  document.onclick = e=>{
    if(!s.contains(e.target)&&!m.contains(e.target))s.classList.remove("show");
  };

  document.getElementById("logoutBtn").onclick=()=>{
    localStorage.clear();
    location.href="../login.html";
  };

  const f=document.getElementById("ccPayForm");
  const msg=document.getElementById("ccMsg");

  f.addEventListener("submit",e=>{
    e.preventDefault();
    msg.textContent="";
    msg.style.color="red";

    const card=document.getElementById("ccNumber").value;
    const amt=Number(document.getElementById("ccAmount").value);

    if(card.length!==16){
      msg.textContent="❌ Invalid card number!";
      return;
    }

    if(amt<=0){
      msg.textContent="❌ Enter valid amount!";
      return;
    }

    msg.style.color="#00e6e6";
    msg.textContent=`✅ ₹${amt} Credit Card bill paid successfully!`;
    f.reset();
  });

});
</script>

</body>
</html>
