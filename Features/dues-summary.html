<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Total Dues – Paylum Bank</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
  background:url("../Images/BackgroundImageIndex.jpg") center/cover fixed;
  font-family:'Segoe UI',sans-serif;
  margin:0;
  color:#fff;
}
.box{
  background:rgba(0,0,0,.85);
  padding:35px;
  border-radius:15px;
  box-shadow:0 0 15px #00e6e6;
  margin-top:120px;
}
.card-box{
  background:#111;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 10px #00e6e6;
  text-align:center;
}
.total-box{
  border:2px solid gold;
  box-shadow:0 0 20px gold;
}
footer{
  background:#000;
  text-align:center;
  padding:20px;
  color:#aaa;
  margin-top:100px;
}
</style>
</head>

<body>

<div class="container">
  <div class="box text-center">

    <h2 class="text-info mb-4"><i class="bi bi-receipt-cutoff"></i> Total Dues Summary</h2>

    <div class="row g-4">

      <div class="col-md-4">
        <div class="card-box">
          <h5>💳 Credit Card Due</h5>
          <h2 id="ccDue">₹0</h2>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-box">
          <h5>🏦 Loan EMI Due</h5>
          <h2 id="emiDue">₹0</h2>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-box total-box">
          <h5>✅ Total Payable</h5>
          <h2 id="totalDue">₹0</h2>
        </div>
      </div>

    </div>

    <button id="payAllBtn" class="btn btn-success mt-4 w-50">
      <i class="bi bi-lock-fill"></i> Pay All Now
    </button>

    <div id="msg" class="mt-3 fw-bold"></div>

  </div>
</div>

<footer>© 2025 Paylum Bank</footer>

<!-- ================= SUPABASE ================= -->
<script type="module">
import { supabase } from "../config/supabaseClient.js";

/* ================= AUTH ================= */
const email = localStorage.getItem("logged_in_email");
const ACTIVE_ACC = localStorage.getItem("active_account_identifier");

if(!email || !ACTIVE_ACC){
  alert("Unauthorized");
  location.href="../login.html";
  throw new Error("Unauthorized");
}

const ccBox = document.getElementById("ccDue");
const emiBox = document.getElementById("emiDue");
const totalBox = document.getElementById("totalDue");
const msg = document.getElementById("msg");

let CREDIT_DUE = 0;
let EMI_DUE = 0;
let TOTAL = 0;
let ACCOUNT_BAL = 0;

/* ================= LOAD ACCOUNT BALANCE ================= */
async function loadBalance(){
  const { data } = await supabase
    .from("accounts")
    .select("balance")
    .eq("account_id", ACTIVE_ACC)
    .single();

  ACCOUNT_BAL = Number(data.balance || 0);
}

/* ================= LOAD CREDIT CARD DUES ================= */
async function loadCreditDue(){
  const { data } = await supabase
    .from("transactions")
    .select("amount")
    .eq("account_id", ACTIVE_ACC)
    .eq("type", "Payment");

  CREDIT_DUE = data?.reduce((s,x)=>s+Number(x.amount),0) || 0;
}

/* ================= LOAD ACTIVE LOAN EMI ================= */
async function loadLoanEMI(){
  const { data } = await supabase
    .from("loans")
    .select("emi_amount")
    .eq("id", (await getUserID()));

  EMI_DUE = data?.reduce((s,x)=>s+Number(x.emi_amount),0) || 0;
}

/* ================= GET USER ID ================= */
async function getUserID(){
  const { data } = await supabase
    .from("users")
    .select("id")
    .eq("email", email)
    .single();

  return data.id;
}

/* ================= LOAD ALL ================= */
async function loadAll(){
  await loadBalance();
  await loadCreditDue();
  await loadLoanEMI();

  ccBox.textContent = "₹" + CREDIT_DUE.toLocaleString();
  emiBox.textContent = "₹" + EMI_DUE.toLocaleString();

  TOTAL = CREDIT_DUE + EMI_DUE;
  totalBox.textContent = "₹" + TOTAL.toLocaleString();
}

loadAll();

/* ================= PAY ALL ================= */
document.getElementById("payAllBtn").onclick = async () => {

  if(TOTAL <= 0){
    alert("No dues to pay.");
    return;
  }

  if(TOTAL > ACCOUNT_BAL){
    alert("Insufficient Balance!");
    return;
  }

  // Deduct from account
  const newBal = ACCOUNT_BAL - TOTAL;

  await supabase
    .from("accounts")
    .update({ balance:newBal })
    .eq("account_id", ACTIVE_ACC);

  // Log transaction
  await supabase.from("transactions").insert({
    account_id: ACTIVE_ACC,
    type: "Payment",
    amount: TOTAL,
    description: "Auto Payment of Total Dues"
  });

  msg.style.color="#00e6e6";
  msg.textContent="✅ All dues paid successfully!";
  loadAll();
};
</script>

</body>
</html>
