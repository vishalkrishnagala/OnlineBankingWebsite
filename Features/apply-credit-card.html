<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Apply for Credit Card – Paylum Bank</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{background:url("../Images/BackgroundImageIndex.jpg")center/cover fixed;color:#fff;font-family:'Segoe UI',sans-serif;margin:0;}
.sidebar{position:fixed;top:0;left:-250px;width:250px;height:100%;background:rgba(0,0,0,.9);padding-top:60px;transition:left .25s;z-index:999}
.sidebar.show{left:0}
.sidebar a{display:block;padding:15px 25px;color:#ccc;text-decoration:none;font-weight:500}
.sidebar a:hover{background:#00e6e6;color:#000}
.menu-toggle{position:fixed;top:15px;left:15px;z-index:1000}
.menu-toggle img{width:40px}
.box{background:rgba(0,0,0,.85);padding:40px;border-radius:15px;box-shadow:0 0 15px #00e6e6;margin-top:120px}
footer{background:#000;text-align:center;padding:20px;color:#aaa;margin-top:100px}
</style>
</head>

<body>

<div class="menu-toggle">
  <button id="menuBtn" class="btn btn-link p-0">
    <img src="../Images/transparent-hd-white-menu-burger-icon-701751695037039ulxnzxwywi.png">
  </button>
</div>

<div id="sidebar" class="sidebar">
  <a href="../main.html"><i class="bi bi-house-door"></i> Home</a>
  <a href="../main.html"><i class="bi bi-person-circle"></i> Account</a>
  <a href="../main.html"><i class="bi bi-gear"></i> Features</a>
  <a id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="container">
 <div class="box">
  <h2 class="text-info"><i class="bi bi-credit-card"></i> Apply for Credit Card</h2>

  <form id="ccForm" class="mt-3">
   <input id="name" class="form-control mb-2" placeholder="Full Name" required>
   <input id="email" type="email" class="form-control mb-2" placeholder="Email" required>
   <input type="number" id="income" class="form-control mb-2" placeholder="Monthly Income (₹)" required>

   <select id="type" class="form-select mb-2">
     <option>Gold Card</option>
     <option>Platinum Card</option>
     <option>Signature Card</option>
   </select>

   <button class="btn btn-success w-100">
     <i class="bi bi-check2"></i> Submit Application
   </button>
  </form>

  <div id="ccMsg" class="text-center mt-3 fw-bold"></div>
 </div>
</div>

<footer>&copy; 2025 Paylum Bank</footer>

<!-- ============================ -->
<!-- ✅ DATABASE SCRIPT -->
<!-- ============================ -->
<script type="module">
import { supabase } from "../config/supabaseClient.js";

/* ================= AUTH ================= */
const email = localStorage.getItem("logged_in_email");
if (!email) {
  alert("Unauthorized");
  location.href = "../login.html";
  throw new Error("Auth required");
}

/* ================= SIDEBAR ================= */
const s = document.getElementById("sidebar");
const m = document.getElementById("menuBtn");

m.onclick = () => s.classList.toggle("show");
document.onclick = e => {
  if (!s.contains(e.target) && !m.contains(e.target)) {
    s.classList.remove("show");
  }
};

document.getElementById("logoutBtn").onclick = () => {
  localStorage.clear();
  location.href = "../login.html";
};

/* ================= FORM ELEMENTS ================= */
const f = document.getElementById("ccForm");
const msg = document.getElementById("ccMsg");

/* ================= ✅ KYC CHECK ON PAGE LOAD ================= */
async function checkKYC() {
  msg.style.color = "red";
  msg.textContent = "Checking KYC...";

  const { data: user, error } = await supabase
    .from("users")
    .select("id, pancard, address")
    .eq("email", email)
    .single();

  if (error || !user) {
    msg.textContent = "User not found.";
    f.style.display = "none";
    return;
  }

  // ✅ BLOCK FORM IF PAN OR ADDRESS IS MISSING
  if (!user.pancard || !user.address) {
    f.style.display = "none";   // ❌ Hides the form

    msg.innerHTML = `
      ❌ PAN Card & Address are required to apply for a Credit Card.<br><br>
      <a href="update-profile.html" class="btn btn-warning btn-sm">
        Update KYC Now
      </a>
    `;
    return;
  }

  // ✅ ALLOW FORM IF KYC IS COMPLETE
  msg.textContent = "";
  f.style.display = "block";
  window.__USER_ID__ = user.id; // store for later submit
}

checkKYC();

/* ================= ✅ FORM SUBMIT ================= */
f.addEventListener("submit", async e => {
  e.preventDefault();
  msg.textContent = "";
  msg.style.color = "red";

  const income = Number(document.getElementById("income").value);
  const type = document.getElementById("type").value;

  if (income < 30000) {
    msg.textContent = "❌ Minimum income ₹30,000 required.";
    return;
  }

  const { error } = await supabase.from("applications").insert({
    id: window.__USER_ID__,
    type: "Credit Card",
    status: "Pending",
    amount_requested: income * 3
  });

  if (error) {
    console.error(error);
    msg.textContent = "Application failed. Try again.";
    return;
  }

  msg.style.color = "#00e6e6";
  msg.textContent = "✅ Credit Card application submitted successfully!";
  f.reset();
});
</script>


</body>
</html>
