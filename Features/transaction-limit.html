<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Transaction Limits – Paylum Bank</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{background:url("../Images/BackgroundImageIndex.jpg") center/cover fixed;color:#fff;font-family:'Segoe UI',sans-serif;margin:0;}
.sidebar{position:fixed;top:0;left:-250px;width:250px;height:100%;background:rgba(0,0,0,.9);padding-top:60px;transition:left .25s;z-index:999}
.sidebar.show{left:0}.sidebar a{display:block;padding:15px 25px;color:#ccc;text-decoration:none;font-weight:500}
.sidebar a:hover{background:#00e6e6;color:#000}.menu-toggle{position:fixed;top:15px;left:15px;z-index:1000}.menu-toggle img{width:40px}
.box{background:rgba(0,0,0,.8);padding:40px;border-radius:15px;box-shadow:0 0 15px #00e6e6;margin-top:100px;text-align:center}
footer{background:#000;text-align:center;padding:20px;color:#aaa;margin-top:100px}
</style>
</head>

<body>

<div class="menu-toggle">
  <button id="menuBtn" class="btn btn-link p-0">
    <img src="../Images/transparent-hd-white-menu-burger-icon-701751695037039ulxnzxwywi.png" alt="Menu">
  </button>
</div>

<div id="sidebar" class="sidebar">
<a href="../main.html"><i class="bi bi-house-door"></i> Home</a>
<a href="../main.html"><i class="bi bi-person-circle"></i> Account</a>
<a href="../main.html"><i class="bi bi-gear"></i> Features</a>
<a id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="container">
 <div class="box">
   <h2 class="text-info"><i class="bi bi-sliders"></i> Transaction Limit Control</h2>
   <p>Adjust your daily transaction limit using the slider below:</p>

   <input type="range" id="limit" class="form-range" min="1000" max="100000" step="1000" value="50000">
   <h4 id="display">₹50,000</h4>

   <button id="save" class="btn btn-success mt-2">
     <i class="bi bi-check2"></i> Save Limit
   </button>

   <div id="msg" class="mt-3 fw-bold"></div>
 </div>
</div>

<footer>&copy; 2025 Paylum Bank</footer>

<!-- ============== SUPABASE + LOGIC ============== -->
<script type="module">
import { supabase } from "../config/supabaseClient.js";

/* ================= AUTH ================= */
const email = localStorage.getItem("logged_in_email");
if(!email){
  alert("Unauthorized");
  location.href="../login.html";
  throw new Error("No session");
}

/* ================= SIDEBAR ================= */
const s=document.getElementById("sidebar");
const m=document.getElementById("menuBtn");

m.onclick=()=>s.classList.toggle("show");
document.onclick=e=>{
  if(!s.contains(e.target)&&!m.contains(e.target)){
    s.classList.remove("show");
  }
};

/* ================= LOGOUT ================= */
document.getElementById("logoutBtn").onclick=()=>{
  localStorage.clear();
  location.href="../login.html";
};

/* ================= ELEMENTS ================= */
const range=document.getElementById("limit");
const display=document.getElementById("display");
const msg=document.getElementById("msg");

/* ================= FORMAT ================= */
range.addEventListener("input",()=>{
  display.textContent=`₹${Number(range.value).toLocaleString()}`;
});

/* ================= LOAD USER & LIMIT ================= */
let USER_ID = null;

async function loadLimit(){
  msg.textContent="Loading limit...";

  // 1️⃣ Get User
  const { data:user, error:userErr } = await supabase
    .from("users")
    .select("id")
    .eq("email", email)
    .single();

  if(userErr || !user){
    msg.textContent="User not found.";
    return;
  }

  USER_ID = user.id;

  // 2️⃣ Get Limit
  const { data:limitRec } = await supabase
    .from("security_settings")
    .select("transaction_limit")
    .eq("id", USER_ID)
    .single();

  if(limitRec){
    range.value = limitRec.transaction_limit;
    display.textContent = `₹${Number(limitRec.transaction_limit).toLocaleString()}`;
  }

  msg.textContent="";
}

loadLimit();

/* ================= SAVE LIMIT ================= */
document.getElementById("save").addEventListener("click", async ()=>{

  msg.style.color="red";
  msg.textContent="Saving...";

  const newLimit = Number(range.value);

  // ✅ UPSERT (create or update)
  const { error } = await supabase
    .from("security_settings")
    .upsert({
      id: USER_ID,
      transaction_limit: newLimit
    });

  if(error){
    console.error(error);
    msg.textContent="Failed to save limit.";
    return;
  }

  msg.style.color="#00e6e6";
  msg.textContent=`✅ New limit set to ₹${newLimit.toLocaleString()}`;
});
</script>

</body>
</html>
