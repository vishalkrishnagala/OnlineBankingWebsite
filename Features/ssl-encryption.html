<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SSL Encryption – Paylum Bank</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:url("../Images/BackgroundImageIndex.jpg") center/cover fixed;color:#fff;font-family:'Segoe UI',sans-serif;margin:0;}
.sidebar{position:fixed;top:0;left:-250px;width:250px;height:100%;background:rgba(0,0,0,.9);padding-top:60px;transition:left .25s;z-index:999}
.sidebar.show{left:0}.sidebar a{display:block;padding:15px 25px;color:#ccc;text-decoration:none;font-weight:500}
.sidebar a:hover{background:#00e6e6;color:#000}.menu-toggle{position:fixed;top:15px;left:15px;z-index:1000}.menu-toggle img{width:40px}
.box{background:rgba(0,0,0,.8);padding:40px;border-radius:15px;box-shadow:0 0 15px #00e6e6;margin-top:100px;text-align:center}
#testRes{margin-top:15px;font-weight:bold}
footer{background:#000;text-align:center;padding:20px;color:#aaa;margin-top:100px}
</style>
</head>
<body>
<div class="menu-toggle"><button id="menuBtn" class="btn btn-link p-0"><img src="../Images/transparent-hd-white-menu-burger-icon-701751695037039ulxnzxwywi.png" alt="Menu"></button></div>
<div id="sidebar" class="sidebar">
<a href="../index.html"><i class="bi bi-house-door"></i> Home</a>
<a href="../account.html"><i class="bi bi-person-circle"></i> Account</a>
<a href="../features.html"><i class="bi bi-gear"></i> Features</a>
<a href="../login.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="container">
 <div class="box">
   <h2 class="text-info"><i class="bi bi-lock-fill"></i> SSL Encryption</h2>
   <p>All Paylum transactions are protected with 256-bit SSL encryption for your safety.</p>
   <button id="testBtn" class="btn btn-success mt-3"><i class="bi bi-shield-check"></i> Test Connection</button>
   <div id="testRes"></div>
 </div>
</div>

<footer>&copy; 2025 Paylum Bank</footer>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const s=document.getElementById("sidebar"),m=document.getElementById("menuBtn");
 const toggle=()=>s.classList.toggle("show"),close=()=>s.classList.remove("show");
 m.addEventListener("click",toggle);s.addEventListener("click",e=>{if(e.target.closest("a"))close();});
 document.addEventListener("click",e=>{if(!s.contains(e.target)&&!m.contains(e.target))close();});
 const b=document.getElementById("testBtn"),r=document.getElementById("testRes");
 b.addEventListener("click",()=>{
  r.style.color="#00e6e6";r.textContent="Testing connection...";
  setTimeout(()=>{r.textContent="✅ Secure connection verified via SSL-256";},1500);
 });
});
</script>
</body>
</html>
