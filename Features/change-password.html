<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Change Password – Paylum Bank</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:url("../Images/BackgroundImageIndex.jpg")center/cover fixed;color:#fff;font-family:'Segoe UI',sans-serif;margin:0;}
.sidebar{position:fixed;top:0;left:-250px;width:250px;height:100%;background:rgba(0,0,0,.9);padding-top:60px;transition:left .25s;z-index:999}
.sidebar.show{left:0}.sidebar a{display:block;padding:15px 25px;color:#ccc;text-decoration:none;font-weight:500}
.sidebar a:hover{background:#00e6e6;color:#000}.menu-toggle{position:fixed;top:15px;left:15px;z-index:1000}.menu-toggle img{width:40px}
.box{background:rgba(0,0,0,.8);padding:40px;border-radius:15px;box-shadow:0 0 15px #00e6e6;margin-top:100px}
footer{background:#000;text-align:center;padding:20px;color:#aaa;margin-top:100px}
</style>
</head>
<body>

<div class="menu-toggle">
  <button id="menuBtn" class="btn btn-link p-0">
    <img src="../Images/transparent-hd-white-menu-burger-icon-701751695037039ulxnzxwywi.png" alt="Menu">
  </button>
</div>

<div id="sidebar" class="sidebar">
<a href="../main.html"><i class="bi bi-house-door"></i> Home</a>
<a href="../main.html"><i class="bi bi-person-circle"></i> Account</a>
<a href="../main.html"><i class="bi bi-gear"></i> Features</a>
<a id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="container">
 <div class="box">
  <h2 class="text-info"><i class="bi bi-key"></i> Change Password</h2>

  <form id="passForm" class="mt-3">
    <input type="password" class="form-control mb-2" id="old" placeholder="Old Password" required>
    <input type="password" class="form-control mb-2" id="new1" placeholder="New Password" required>
    <input type="password" class="form-control mb-2" id="new2" placeholder="Confirm New Password" required>

    <button class="btn btn-success w-100">
      <i class="bi bi-lock"></i> Update Password
    </button>
  </form>

  <div id="passMsg" class="text-center mt-3 fw-bold"></div>
 </div>
</div>

<footer>&copy;2025 Paylum Bank</footer>

<!-- ================= SUPABASE + LOGIC ================= -->
<script type="module">
import { supabase } from "../config/supabaseClient.js";

/* ================= AUTH ================= */
const email = localStorage.getItem("logged_in_email");
if(!email){
  alert("Unauthorized");
  location.href="../login.html";
  throw new Error("No session");
}

/* ================= SIDEBAR ================= */
const s=document.getElementById("sidebar");
const m=document.getElementById("menuBtn");

m.onclick=()=>s.classList.toggle("show");
document.onclick=e=>{
  if(!s.contains(e.target)&&!m.contains(e.target)){
    s.classList.remove("show");
  }
};

/* ================= LOGOUT ================= */
document.getElementById("logoutBtn").onclick=()=>{
  localStorage.clear();
  location.href="../login.html";
};

/* ================= ELEMENTS ================= */
const f=document.getElementById("passForm");
const msg=document.getElementById("passMsg");

/* ================= SHA-256 ================= */
async function sha256(text){
  const enc=new TextEncoder().encode(text);
  const buf=await crypto.subtle.digest("SHA-256",enc);
  return [...new Uint8Array(buf)]
    .map(x=>x.toString(16).padStart(2,"0"))
    .join("");
}

/* ================= CHANGE PASSWORD ================= */
f.addEventListener("submit", async e=>{
  e.preventDefault();
  msg.textContent="";
  msg.style.color="red";

  const oldPass=document.getElementById("old").value.trim();
  const new1=document.getElementById("new1").value.trim();
  const new2=document.getElementById("new2").value.trim();

  if(new1.length < 6){
    msg.textContent="❌ Password must be at least 6 characters.";
    return;
  }

  if(new1 !== new2){
    msg.textContent="❌ New passwords do not match.";
    return;
  }

  // ✅ Fetch user hash
  const { data:user, error:userErr } = await supabase
    .from("users")
    .select("id, password_hash")
    .eq("email", email)
    .single();

  if(userErr || !user){
    msg.textContent="User not found.";
    return;
  }

  // ✅ Verify old password
  const oldHash = await sha256(oldPass);

  if(oldHash !== user.password_hash){
    msg.textContent="❌ Old password is incorrect.";
    return;
  }

  // ✅ Update new password
  const newHash = await sha256(new1);

  const { error:updateErr } = await supabase
    .from("users")
    .update({ password_hash: newHash })
    .eq("id", user.id);

  if(updateErr){
    console.error(updateErr);
    msg.textContent="❌ Password update failed. Try again.";
    return;
  }

  // ✅ SUCCESS
  msg.style.color="#00e6e6";
  msg.textContent="✅ Password updated successfully!";
  f.reset();
});
</script>

</body>
</html>
