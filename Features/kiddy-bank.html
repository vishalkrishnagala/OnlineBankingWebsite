<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kiddy Bank – Parent Control</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:url("../Images/BackgroundImageIndex.jpg") center/cover fixed;color:white;font-family:'Segoe UI',sans-serif;margin:0;}
.sidebar{position:fixed;top:0;left:-250px;width:250px;height:100%;background:rgba(0,0,0,.9);padding-top:60px;transition:left .25s;z-index:999}
.sidebar.show{left:0}.sidebar a{display:block;padding:15px 25px;color:#ccc;text-decoration:none}
.sidebar a:hover{background:#00e6e6;color:#000}
.menu-toggle{position:fixed;top:15px;left:15px;z-index:1000}.menu-toggle img{width:40px}
.box{background:rgba(0,0,0,.85);padding:40px;border-radius:16px;box-shadow:0 0 20px gold;margin-top:120px}
</style>
</head>

<body>

<div class="menu-toggle">
  <button id="menuBtn" class="btn btn-link p-0">
    <img src="../Images/transparent-hd-white-menu-burger-icon-701751695037039ulxnzxwywi.png">
  </button>
</div>

<div id="sidebar" class="sidebar">
  <a href="../main.html">🏠 Home</a>
  <a href="../features.html">⚙ Features</a>
  <a href="../account.html">👤 Account</a>
  <a id="logoutBtn">🚪 Logout</a>
</div>

<div class="container">
  <div class="box">

    <h3 class="text-warning mb-3">👶 Kiddy Bank – Parent Control</h3>

    <form id="kiddyForm">
      <input id="childName" class="form-control mb-2" placeholder="Child Name" required>
      <input id="childEmail" type="email" class="form-control mb-2" placeholder="Child Email" required>
      <input id="childPhone" class="form-control mb-2" placeholder="Child Phone" required>
      <input id="amount" type="number" class="form-control mb-2" placeholder="Initial Amount ₹" required>
      <input id="limit" type="number" class="form-control mb-3" placeholder="Monthly Limit ₹" required>
      <button class="btn btn-warning w-100">Create & Fund Wallet</button>
    </form>

    <div id="msg" class="mt-3 fw-bold text-center"></div>

    <hr>

    <h5 class="text-info mt-4">Your Kids</h5>
    <div id="kidsList"></div>

  </div>
</div>

<script type="module">
import { supabase } from "../config/supabaseClient.js";
import emailjs from "https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js";
emailjs.init("skhy1cZMisVDqb1Xs");

const email = localStorage.getItem("logged_in_email");
if (!email) location.href="../login.html";

const s=document.getElementById("sidebar"),m=document.getElementById("menuBtn");
m.onclick=()=>s.classList.toggle("show");
document.onclick=e=>{if(!s.contains(e.target)&&!m.contains(e.target))s.classList.remove("show");};
logoutBtn.onclick=()=>{localStorage.clear();location.href="../login.html";};

const form=document.getElementById("kiddyForm");
const msg=document.getElementById("msg");
const kidsList=document.getElementById("kidsList");

let USER_ID=null, ACTIVE_ACCOUNT=null;

async function loadParent(){
 const { data:user } = await supabase.from("users").select("id").eq("email",email).single();
 USER_ID=user.id;
 const { data:acc } = await supabase.from("accounts").select("*")
 .eq("id",USER_ID).limit(1).single();
 ACTIVE_ACCOUNT=acc;
}
await loadParent();

form.addEventListener("submit",async e=>{
 e.preventDefault();
 msg.textContent="Processing...";
 const amt=Number(amount.value), lim=Number(limit.value);
 if(amt>ACTIVE_ACCOUNT.balance){msg.textContent="Insufficient funds.";return;}

 await supabase.from("accounts")
 .update({balance:ACTIVE_ACCOUNT.balance-amt})
 .eq("account_id",ACTIVE_ACCOUNT.account_id);

 const { error } = await supabase.from("kiddy_wallets").insert({
 parent_user_id:USER_ID,
 child_name:childName.value,
 child_email:childEmail.value,
 child_phone:childPhone.value,
 balance:amt,
 monthly_limit:lim,
 is_active:true
 });

 if(error){msg.textContent="Failed";return;}

 msg.style.color="#00ff9c";
 msg.textContent="✅ Wallet Created & Funded";

 form.reset();
 loadKids();
});

async function loadKids(){
 const { data } = await supabase.from("kiddy_wallets")
 .select("*").eq("parent_user_id",USER_ID);

 kidsList.innerHTML="";
 if(!data.length){kidsList.innerHTML="<span style='color:white'>No kids added</span>";return;}

 data.forEach(k=>{
 const d=document.createElement("div");
 d.className="border p-3 mb-3";
 d.innerHTML=`
 <b>${k.child_name}</b> (${k.is_active?"🟢 Active":"🔴 Frozen"})<br>
 Balance ₹${k.balance}<br>
 Monthly Limit ₹${k.monthly_limit}
 <div class="mt-2 d-flex gap-2">
 <button class="btn btn-sm btn-info" onclick="openWallet('${k.wallet_id}')">Open</button>
 <button class="btn btn-sm btn-warning" onclick="toggleWallet('${k.wallet_id}',${k.is_active})">
 ${k.is_active?"Freeze":"Unfreeze"}
 </button>
 </div>`;
 kidsList.appendChild(d);
 });
}

window.toggleWallet=async(id,state)=>{
 await supabase.from("kiddy_wallets")
 .update({is_active:!state})
 .eq("wallet_id",id);
 loadKids();
};

window.openWallet=id=>{
 localStorage.setItem("active_kiddy_wallet",id);
 location.href="kiddy-spend.html";
};

loadKids();
</script>
</body>
</html>
