<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply for Loan – Paylum Bank</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
  background:url("../Images/BackgroundImageIndex.jpg") center/cover fixed;
  color:#fff;
  font-family:'Segoe UI',sans-serif;
  margin:0;
}
.sidebar{
  position:fixed;top:0;left:-250px;width:250px;height:100%;
  background:rgba(0,0,0,.9);padding-top:60px;
  transition:left .25s;z-index:999
}
.sidebar.show{left:0}
.sidebar a{
  display:block;padding:15px 25px;
  color:#ccc;text-decoration:none;font-weight:500
}
.sidebar a:hover{background:#00e6e6;color:#000}
.menu-toggle{
  position:fixed;top:15px;left:15px;z-index:1000
}
.menu-toggle img{width:40px}
.box{
  background:rgba(0,0,0,.85);padding:40px;
  border-radius:15px;box-shadow:0 0 15px #00e6e6;
  margin-top:120px
}
footer{
  background:#000;text-align:center;
  padding:20px;color:#aaa;margin-top:100px
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="menu-toggle">
  <button id="menuBtn" class="btn btn-link p-0">
    <img src="../Images/transparent-hd-white-menu-burger-icon-701751695037039ulxnzxwywi.png">
  </button>
</div>

<div id="sidebar" class="sidebar">
  <a href="../main.html"><i class="bi bi-house-door"></i> Home</a>
  <a href="../main.html"><i class="bi bi-person-circle"></i> Account</a>
  <a href="../main.html"><i class="bi bi-gear"></i> Features</a>
  <a id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<!-- ================= FORM ================= -->
<div class="container">
 <div class="box">
  <h2 class="text-info"><i class="bi bi-cash-coin"></i> Apply for Loan</h2>

  <form id="loanForm" class="mt-3" style="display:none">

    <select id="loanType" class="form-select mb-2">
      <option>Personal Loan</option>
      <option>Home Loan</option>
      <option>Car Loan</option>
    </select>

    <input type="number" id="amount" class="form-control mb-2"
           placeholder="Loan Amount (₹)" required>

    <input type="number" id="tenure" class="form-control mb-2"
           placeholder="Tenure (in years)" required>

    <button class="btn btn-success w-100">
      <i class="bi bi-check2"></i> Submit Request
    </button>

  </form>

  <div id="loanMsg" class="text-center mt-3 fw-bold"></div>
 </div>
</div>

<footer>&copy; 2025 Paylum Bank</footer>

<!-- ================= DATABASE + LOGIC ================= -->
<script type="module">
import { supabase } from "../config/supabaseClient.js";

document.addEventListener("DOMContentLoaded", async () => {

/* ================= AUTH ================= */
const email = localStorage.getItem("logged_in_email");
if (!email) {
  alert("Unauthorized");
  window.location.href = "../login.html";
  return;
}

/* ================= SIDEBAR ================= */
const s = document.getElementById("sidebar");
const m = document.getElementById("menuBtn");
const logoutBtn = document.getElementById("logoutBtn");

m.onclick = () => s.classList.toggle("show");

document.addEventListener("click", e => {
  if (!s.contains(e.target) && !m.contains(e.target)) {
    s.classList.remove("show");
  }
});

logoutBtn.onclick = () => {
  localStorage.clear();
  window.location.href = "../login.html";
};

/* ================= FORM ELEMENTS ================= */
const f = document.getElementById("loanForm");
const msg = document.getElementById("loanMsg");

/* ================= ✅ KYC CHECK ================= */
async function checkKYC() {
  msg.style.color = "red";
  msg.textContent = "Checking KYC...";

  const { data: user, error } = await supabase
    .from("users")
    .select("id, pancard, address")
    .eq("email", email)
    .single();

  if (error || !user) {
    msg.textContent = "User not found.";
    f.style.display = "none";
    return;
  }

  // ❌ BLOCK IF KYC MISSING
  if (!user.pancard || !user.address) {
    f.style.display = "none";
    msg.innerHTML = `
      ❌ PAN Card & Address are required to apply for a Loan.<br><br>
      <a href="update-profile.html" class="btn btn-warning btn-sm">
        Update KYC Now
      </a>
    `;
    return;
  }

  // ✅ ALLOW FORM
  msg.textContent = "";
  f.style.display = "block";
  window.__USER_ID__ = user.id;
}

await checkKYC();

/* ================= ✅ FORM SUBMIT ================= */
f.addEventListener("submit", async e => {
  e.preventDefault();
  msg.textContent = "";
  msg.style.color = "red";

  const amount = Number(document.getElementById("amount").value);
  const tenureYears = Number(document.getElementById("tenure").value);
  const loanType = document.getElementById("loanType").value;

  if (amount < 50000) {
    msg.textContent = "❌ Minimum loan amount is ₹50,000.";
    return;
  }

  if (tenureYears < 1 || tenureYears > 30) {
    msg.textContent = "❌ Tenure must be between 1 and 30 years.";
    return;
  }

  const { error } = await supabase.from("applications").insert({
    id: window.__USER_ID__,
    type: "Loan",
    status: "Pending",
    amount_requested: amount
  });

  if (error) {
    console.error(error);
    msg.textContent = "Loan request failed. Try again.";
    return;
  }

  msg.style.color = "#00e6e6";
  msg.textContent = `✅ ${loanType} request of ₹${amount.toLocaleString()} submitted successfully!`;
  f.reset();
});

});
</script>

</body>
</html>
