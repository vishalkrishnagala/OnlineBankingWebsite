<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EMI Calculator – Paylum Bank</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
  background:url("../Images/BackgroundImageIndex.jpg") center/cover fixed;
  color:#fff;font-family:'Segoe UI',sans-serif;margin:0;
}
.sidebar{
  position:fixed;top:0;left:-250px;width:250px;height:100%;
  background:rgba(0,0,0,.9);padding-top:60px;
  transition:left .25s;z-index:999
}
.sidebar.show{left:0}
.sidebar a{
  display:block;padding:15px 25px;color:#ccc;
  text-decoration:none;font-weight:500
}
.sidebar a:hover{background:#00e6e6;color:#000}
.menu-toggle{position:fixed;top:15px;left:15px;z-index:1000}
.menu-toggle img{width:40px}

.box{
  background:rgba(0,0,0,.85);padding:40px;
  border-radius:15px;box-shadow:0 0 15px #00e6e6;
  margin-top:120px;text-align:center
}

.result-box{
  margin-top:20px;
  padding:20px;
  border:1px solid #00e6e6;
  border-radius:10px;
}

footer{
  background:#000;text-align:center;
  padding:20px;color:#aaa;margin-top:100px
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="menu-toggle">
  <button id="menuBtn" class="btn btn-link p-0">
    <img src="../Images/transparent-hd-white-menu-burger-icon-701751695037039ulxnzxwywi.png">
  </button>
</div>

<div id="sidebar" class="sidebar">
  <a href="../main.html"><i class="bi bi-house-door"></i> Home</a>
  <a href="../main.html"><i class="bi bi-person-circle"></i> Account</a>
  <a href="../main.html"><i class="bi bi-gear"></i> Features</a>
  <a id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<!-- ================= CONTENT ================= -->
<div class="container">
 <div class="box">
  <h2 class="text-info">
    <i class="bi bi-calculator"></i> EMI Calculator
  </h2>

  <form id="emiForm" class="mt-4">
    <input type="number" id="p" class="form-control mb-2" placeholder="Loan Amount (₹)" required>
    <input type="number" id="r" class="form-control mb-2" placeholder="Interest Rate (%) per annum" required>
    <input type="number" id="n" class="form-control mb-3" placeholder="Tenure (in years)" required>

    <button class="btn btn-success w-100">
      <i class="bi bi-calculator"></i> Calculate EMI
    </button>
  </form>

  <div id="emiResult" class="result-box d-none">
    <h5 class="text-info">Results</h5>
    <p>Monthly EMI: <b id="emiVal"></b></p>
    <p>Total Interest: <b id="interestVal"></b></p>
    <p>Total Payable: <b id="totalVal"></b></p>
  </div>

 </div>
</div>

<footer>&copy; 2025 Paylum Bank</footer>

<!-- ================= SCRIPT ================= -->
<script>
document.addEventListener("DOMContentLoaded",()=>{

/* ===== AUTH ===== */
const email = localStorage.getItem("logged_in_email");
if (!email) {
  alert("Unauthorized");
  window.location.href = "../login.html";
  return;
}

/* ===== SIDEBAR ===== */
const s=document.getElementById("sidebar");
const m=document.getElementById("menuBtn");
const logoutBtn=document.getElementById("logoutBtn");

m.onclick=()=>s.classList.toggle("show");

document.addEventListener("click",e=>{
  if(!s.contains(e.target)&&!m.contains(e.target)){
    s.classList.remove("show");
  }
});

logoutBtn.onclick=()=>{
  localStorage.clear();
  window.location.href="../login.html";
};

/* ===== EMI CALCULATION ===== */
document.getElementById("emiForm").addEventListener("submit",e=>{
  e.preventDefault();

  const P = Number(document.getElementById("p").value);
  const annualRate = Number(document.getElementById("r").value);
  const years = Number(document.getElementById("n").value);

  if(P <= 0 || annualRate <= 0 || years <= 0){
    alert("Enter valid positive values.");
    return;
  }

  const r = annualRate / 12 / 100;
  const n = years * 12;

  const emi = (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  const totalPayable = emi * n;
  const totalInterest = totalPayable - P;

  document.getElementById("emiVal").textContent =
    `₹${emi.toFixed(2)}`;

  document.getElementById("interestVal").textContent =
    `₹${totalInterest.toFixed(2)}`;

  document.getElementById("totalVal").textContent =
    `₹${totalPayable.toFixed(2)}`;

  document.getElementById("emiResult").classList.remove("d-none");
});
});
</script>

</body>
</html>
