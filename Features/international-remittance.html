<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>International Remittance – Paylum Bank</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{background:url("../Images/BackgroundImageIndex.jpg") center/cover fixed;color:#fff;font-family:'Segoe UI',sans-serif;margin:0;}
.sidebar{position:fixed;top:0;left:-250px;width:250px;height:100%;background:rgba(0,0,0,.9);padding-top:60px;transition:left .25s;z-index:999}
.sidebar.show{left:0}.sidebar a{display:block;padding:15px 25px;color:#ccc;text-decoration:none;font-weight:500}
.sidebar a:hover{background:#00e6e6;color:#000}
.menu-toggle{position:fixed;top:15px;left:15px;z-index:1000}
.menu-toggle img{width:40px}
.form-box{background:rgba(0,0,0,.85);padding:40px;border-radius:15px;box-shadow:0 0 15px #00e6e6;margin-top:120px}
footer{background:#000;text-align:center;padding:20px;color:#aaa;margin-top:100px}
</style>
</head>
<body>

<!-- MENU -->
<div class="menu-toggle">
  <button id="menuBtn" class="btn btn-link p-0">
    <img src="../Images/transparent-hd-white-menu-burger-icon-701751695037039ulxnzxwywi.png">
  </button>
</div>

<div id="sidebar" class="sidebar">
  <a href="../main.html"><i class="bi bi-house-door"></i> Home</a>
  <a href="../main.html"><i class="bi bi-person-circle"></i> Account</a>
  <a href="../main.html"><i class="bi bi-gear"></i> Features</a>
  <a id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<!-- FORM -->
<div class="container">
  <div class="form-box">
    <h2 class="text-info mb-4"><i class="bi bi-globe2"></i> International Remittance</h2>

    <form id="remitForm">
      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Recipient Name</label>
          <input type="text" class="form-control" id="rName" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Destination Country</label>
          <select id="country" class="form-select">
            <option value="USD|82">USA (USD)</option>
            <option value="GBP|103">UK (GBP)</option>
            <option value="JPY|0.55">Japan (JPY)</option>
          </select>
        </div>

        <div class="col-md-12">
          <label class="form-label">Amount in INR</label>
          <input type="number" class="form-control" id="inr" min="1" required>
        </div>

      </div>

      <button class="btn btn-success w-100 mt-4" type="submit">
        <i class="bi bi-send"></i> Send Money
      </button>

    </form>

    <div id="res" class="text-center mt-3 fw-bold"></div>
  </div>
</div>

<footer>&copy; 2025 Paylum Bank</footer>

<!-- =============================== -->
<!-- ✅ DATABASE SCRIPT -->
<!-- =============================== -->
<script type="module">
import { supabase } from "../config/supabaseClient.js";

/* ================= AUTH ================= */
const email = localStorage.getItem("logged_in_email");
if (!email) {
  alert("Unauthorized");
  location.href = "../login.html";
  throw new Error("Auth required");
}

/* ================= SIDEBAR ================= */
const sidebar=document.getElementById("sidebar");
const menu=document.getElementById("menuBtn");

menu.onclick=()=>sidebar.classList.toggle("show");
document.onclick=e=>{
  if(!sidebar.contains(e.target)&&!menu.contains(e.target)){
    sidebar.classList.remove("show");
  }
};

document.getElementById("logoutBtn").onclick=()=>{
  localStorage.clear();
  location.href="../login.html";
};

/* ================= ACTIVE ACCOUNT ================= */
let activeAccount=null;

async function loadActiveAccount(){
  const { data:user } = await supabase
    .from("users")
    .select("id")
    .eq("email",email)
    .single();

  const uuid = localStorage.getItem("active_account_identifier");

  const { data:acc } = await supabase
    .from("accounts")
    .select("*")
    .eq("account_id", uuid)
    .single();

  activeAccount = acc;
}

await loadActiveAccount();

/* ================= REMITTANCE ================= */
const form=document.getElementById("remitForm");
const res=document.getElementById("res");

form.addEventListener("submit",async e=>{
  e.preventDefault();

  const name=document.getElementById("rName").value.trim();
  const inr=Number(document.getElementById("inr").value);
  const [currency, rate]=document.getElementById("country").value.split("|");

  res.style.color="red";
  res.textContent="";

  if(inr<=0){
    res.textContent="Enter a valid amount.";
    return;
  }

  if(inr > activeAccount.balance){
    res.textContent="Insufficient balance.";
    return;
  }

  const foreignAmount=(inr / rate).toFixed(2);

  /* ✅ INSERT INTO DATABASE */
  await supabase.from("remittances").insert({
    account_id: activeAccount.account_id,
    recipient_name: name,
    recipient_country: currency,
    amount: inr,
    exchange_rate: rate
  });

  /* ✅ UPDATE BALANCE */
  await supabase.from("accounts").update({
    balance: activeAccount.balance - inr
  }).eq("account_id",activeAccount.account_id);

  res.style.color="#00e6e6";
  res.textContent=`₹${inr.toFixed(2)} sent successfully. Recipient will receive ≈ ${foreignAmount} ${currency}.`;

  form.reset();
  await loadActiveAccount();
});
</script>

</body>
</html>
