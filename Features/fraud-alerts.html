<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fraud Alerts – Paylum Bank</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{background:url("../Images/BackgroundImageIndex.jpg") center/cover fixed;color:#fff;font-family:'Segoe UI',sans-serif;margin:0;}
.sidebar{position:fixed;top:0;left:-250px;width:250px;height:100%;background:rgba(0,0,0,.9);padding-top:60px;transition:left .25s;z-index:999}
.sidebar.show{left:0}
.sidebar a{display:block;padding:15px 25px;color:#ccc;text-decoration:none;font-weight:500}
.sidebar a:hover{background:#00e6e6;color:#000}
.menu-toggle{position:fixed;top:15px;left:15px;z-index:1000}
.menu-toggle img{width:40px}
.box{background:rgba(0,0,0,.8);padding:40px;border-radius:15px;box-shadow:0 0 15px #00e6e6;margin-top:100px;text-align:center}
footer{background:#000;text-align:center;padding:20px;color:#aaa;margin-top:100px}
</style>
</head>

<body>

<div class="menu-toggle">
  <button id="menuBtn" class="btn btn-link p-0">
    <img src="../Images/transparent-hd-white-menu-burger-icon-701751695037039ulxnzxwywi.png" alt="Menu">
  </button>
</div>

<div id="sidebar" class="sidebar">
<a href="../main.html"><i class="bi bi-house-door"></i> Home</a>
<a href="../main.html"><i class="bi bi-person-circle"></i> Account</a>
<a href="../main.html"><i class="bi bi-gear"></i> Features</a>
<a id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="container">
 <div class="box">
   <h2 class="text-info"><i class="bi bi-exclamation-triangle"></i> Fraud Alerts</h2>
   <p>We constantly monitor your transactions to detect unusual activity.</p>

   <button id="simulate" class="btn btn-warning mt-3">
     <i class="bi bi-bell"></i> Simulate Alert
   </button>

   <div id="alertBox" class="mt-3 fw-bold"></div>

   <hr class="text-secondary mt-4">
   <h5 class="text-info">Recent Alerts</h5>
   <div id="alertHistory" class="mt-2 small"></div>
 </div>
</div>

<footer>&copy; 2025 Paylum Bank</footer>

<!-- ============ SUPABASE LOGIC ============ -->
<script type="module">
import { supabase } from "../config/supabaseClient.js";

/* ================= AUTH ================= */
const email = localStorage.getItem("logged_in_email");
if(!email){
  alert("Unauthorized");
  location.href="../login.html";
  throw new Error("No session");
}

/* ================= SIDEBAR ================= */
const s=document.getElementById("sidebar");
const m=document.getElementById("menuBtn");

m.onclick=()=>s.classList.toggle("show");
document.onclick=e=>{
  if(!s.contains(e.target)&&!m.contains(e.target)){
    s.classList.remove("show");
  }
};

/* ================= LOGOUT ================= */
document.getElementById("logoutBtn").onclick=()=>{
  localStorage.clear();
  location.href="../login.html";
};

/* ================= ELEMENTS ================= */
const btn = document.getElementById("simulate");
const box = document.getElementById("alertBox");
const historyBox = document.getElementById("alertHistory");

let USER_ID = null;

/* ================= LOAD USER ================= */
async function loadUser(){
  const { data:user, error } = await supabase
    .from("users")
    .select("id")
    .eq("email", email)
    .single();

  if(error || !user){
    box.textContent="User not found.";
    return;
  }

  USER_ID = user.id;
  loadAlerts();
}

loadUser();

/* ================= LOAD ALERT HISTORY ================= */
async function loadAlerts(){
  const { data, error } = await supabase
    .from("fraud_alerts")
    .select("*")
    .eq("id", USER_ID)
    .order("created_at", { ascending: false })
    .limit(3);

  if(error || !data || data.length === 0){
   historyBox.innerHTML = "<span style='color:white;'>No alerts found.</span>";
    return;
  }

  historyBox.innerHTML = data.map(a => `
    <div class="text-warning mb-1">
      ⚠ ${a.message} <br>
      <span class="text-muted">${new Date(a.created_at).toLocaleString()}</span>
    </div>
  `).join("");
}

/* ================= SIMULATE ALERT ================= */
btn.addEventListener("click", async ()=>{

  box.style.color="orange";
  box.textContent="⚠ Suspicious login attempt detected from new device!";

  const { error } = await supabase
    .from("fraud_alerts")
    .insert({
      id: USER_ID,
      message: "Suspicious login attempt detected from new device"
    });

  if(error){
    console.error(error);
    box.textContent="Failed to store alert.";
    return;
  }

  setTimeout(()=>{
    box.textContent="✅ Alert acknowledged and device blocked.";
    loadAlerts();
  },3000);

});
</script>

</body>
</html>
