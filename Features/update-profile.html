<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Profile – Paylum Bank</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
  background:url("../Images/BackgroundImageIndex.jpg") center/cover fixed;
  color:#fff;font-family:'Segoe UI',sans-serif;margin:0;
}
.sidebar{
  position:fixed;top:0;left:-250px;width:250px;height:100%;
  background:rgba(0,0,0,.9);padding-top:60px;transition:left .25s;z-index:999
}
.sidebar.show{left:0}
.sidebar a{
  display:block;padding:15px 25px;color:#ccc;
  text-decoration:none;font-weight:500
}
.sidebar a:hover{background:#00e6e6;color:#000}
.menu-toggle{position:fixed;top:15px;left:15px;z-index:1000}
.menu-toggle img{width:40px}
.box{
  background:rgba(0,0,0,.85);
  padding:40px;border-radius:15px;
  box-shadow:0 0 15px #00e6e6;margin-top:120px
}
footer{background:#000;text-align:center;padding:20px;color:#aaa;margin-top:100px}
</style>
</head>

<body>

<div class="menu-toggle">
  <button id="menuBtn" class="btn btn-link p-0">
    <img src="../Images/transparent-hd-white-menu-burger-icon-701751695037039ulxnzxwywi.png">
  </button>
</div>

<div id="sidebar" class="sidebar">
  <a href="../main.html"><i class="bi bi-house-door"></i> Home</a>
  <a href="../main.html"><i class="bi bi-person-circle"></i> Account</a>
  <a href="../main.html"><i class="bi bi-gear"></i> Features</a>
  <a id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="container">
  <div class="box">
    <h2 class="text-info"><i class="bi bi-person-gear"></i> Update Profile</h2>

    <form id="profForm" class="mt-3">

      <div class="mb-2">
        <label>Full Name</label>
        <input id="full_name" class="form-control" required>
      </div>

      <div class="mb-2">
        <label>Email (read only)</label>
        <input id="email" class="form-control" readonly>
      </div>

      <div class="mb-2">
        <label>Phone</label>
        <input id="phone" class="form-control" required>
      </div>

      <div class="mb-2">
        <label>Address</label>
        <textarea id="address" class="form-control" rows="2" required></textarea>
      </div>

      <div class="mb-2">
        <label>PAN Card</label>
        <input id="pancard" class="form-control" placeholder="ABCDE1234F">
      </div>

      <button class="btn btn-success w-100 mt-3">
        <i class="bi bi-check2-circle"></i> Save Changes
      </button>
    </form>

    <div id="profMsg" class="text-center mt-3 fw-bold"></div>
  </div>
</div>

<footer>&copy; 2025 Paylum Bank</footer>

<!-- ================= SUPABASE SCRIPT ================= -->
<script type="module">
import { supabase } from "../config/supabaseClient.js";

/* ================= AUTH ================= */
const email = localStorage.getItem("logged_in_email");
if(!email){
  alert("Unauthorized");
  location.href="../login.html";
  throw new Error("No session");
}

/* ================= SIDEBAR ================= */
const s=document.getElementById("sidebar");
const m=document.getElementById("menuBtn");
m.onclick=()=>s.classList.toggle("show");
document.onclick=e=>{
  if(!s.contains(e.target)&&!m.contains(e.target)){
    s.classList.remove("show");
  }
};

/* ================= LOGOUT ================= */
document.getElementById("logoutBtn").onclick=()=>{
  localStorage.clear();
  location.href="../login.html";
};

/* ================= FORM ELEMENTS ================= */
const full_name = document.getElementById("full_name");
const phone     = document.getElementById("phone");
const address   = document.getElementById("address");
const pancard   = document.getElementById("pancard");
const emailBox  = document.getElementById("email");
const f         = document.getElementById("profForm");
const msg       = document.getElementById("profMsg");

let USER_ID = null;

/* ================= LOAD USER DATA ================= */
async function loadProfile(){
  msg.textContent="Loading profile...";

  const { data, error } = await supabase
    .from("users")
    .select("*")
    .eq("email", email)
    .single();

  if(error || !data){
    msg.textContent="Profile not found.";
    msg.style.color="red";
    return;
  }

  USER_ID = data.id;

  full_name.value = data.full_name || "";
  phone.value     = data.phone || "";
  address.value   = data.address || "";
  pancard.value   = data.pancard || "";
  emailBox.value  = data.email;

  msg.textContent="";
}

loadProfile();

/* ================= SAVE PROFILE ================= */
f.addEventListener("submit", async (e)=>{
  e.preventDefault();
  msg.style.color="red";
  msg.textContent="Saving...";

  const { error } = await supabase
    .from("users")
    .update({
      full_name: full_name.value,
      phone: phone.value,
      address: address.value,     // ✅ SAVED
      pancard: pancard.value || null
    })
    .eq("id", USER_ID);

  if(error){
    console.error(error);
    msg.textContent="Update failed. Try again.";
    return;
  }

  msg.style.color="#00e6e6";
  msg.textContent="✅ Profile updated successfully!";
});
</script>

</body>
</html>
